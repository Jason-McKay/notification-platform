# Scrapes both applications over the compose network. Their /actuator/prometheus endpoints
# take the read scope, so every scrape carries the dev token that the scrape-token sidecar
# keeps fresh in /token/scrape. See docs/adr/0007-scraping-inside-compose.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: notification-api
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      # Re-read on every scrape, so the sidecar's refresh needs no reload.
      credentials_file: /token/scrape
    static_configs:
      - targets: ["np-api:8080"]

  - job_name: notification-worker
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /token/scrape
    static_configs:
      - targets: ["np-worker:8081"]
