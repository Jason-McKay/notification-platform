spring.application.name=notification-api
server.port=8080

# Dev is the default profile so a fresh clone boots with Swagger and sensible localhost
# endpoints. Anything real sets SPRING_PROFILES_ACTIVE and overrides the values below.
spring.profiles.default=dev

# --- Kafka -------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# JacksonJsonSerializer, not JsonSerializer: the latter is the Jackson 2 implementation and
# Boot 4 ships Jackson 3 (tools.jackson), which only the Jackson*-prefixed classes use.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# No __TypeId__ header. The consumer is told what type to expect by configuration; letting
# the producer name a class in the message makes the contract a class name and couples the
# two deployables' package layouts together.
spring.kafka.producer.properties.spring.json.add.type.headers=false
# acks and enable.idempotence are set in KafkaProducerConfig, where no property can weaken them.
notification.topic.partitions=3
notification.topic.replicas=1
notification.publish.timeout=PT5S

# --- Redis (idempotency keys only) -------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
notification.idempotency.ttl=PT24H

# --- Auth --------------------------------------------------------------------
# Dev defaults. MUST be overridden by env anywhere real; the secret has to be at least
# 256 bits for HS256 or Nimbus rejects it at startup.
notification.jwt.secret=dev-only-secret-please-override-me-0123456789
notification.auth.client-id=notification-client
notification.auth.client-secret=dev-secret
notification.auth.token-ttl=PT1H

# --- Docs / actuator ---------------------------------------------------------
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
# Off in the base config, switched on only by the dev profile.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# health stays open; metrics and prometheus take the read scope (SecurityConfig), as on the
# worker. Compose scrapes them with a refreshed dev token -- see ADR 0007.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
