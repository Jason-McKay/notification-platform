name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify, not test: ubuntu-latest ships Docker, and NotificationDispatchIT -- the
      # Testcontainers test that proves an event on the topic becomes a row in the database
      # -- only runs under failsafe. Running unit tests alone here would leave the one test
      # that covers the wiring between the two deployables unexecuted in CI.
      - name: Build and test
        run: ./mvnw -B verify

  # The Prometheus config and alert rules compose loads, checked by the promtool in the image
  # compose pins -- keep the two tags in step. One image pull, no Maven.
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --syntax-only because the scrape token file only exists inside compose.
      - name: Check Prometheus config and rules, run the rule tests
        run: |
          promtool() {
            docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
              --entrypoint promtool prom/prometheus:v3.15.1 "$@"
          }
          promtool check config --syntax-only /etc/prometheus/prometheus.yml
          promtool check rules /etc/prometheus/alerts.yml
          promtool test rules /etc/prometheus/alerts.test.yml
