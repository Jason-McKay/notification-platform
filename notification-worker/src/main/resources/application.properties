spring.application.name=notification-worker
server.port=8081

spring.profiles.default=dev

# --- Kafka -------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-worker
# Read from the beginning the first time this group appears, so a worker started after the
# api has already published still delivers those notifications.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# JacksonJsonDeserializer is the Jackson 3 implementation; JsonDeserializer is the Jackson 2
# one and Boot 4 does not ship Jackson 2.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# The consumer decides what type it is reading, not the producer. Paired with the producer's
# add.type.headers=false, so no class name ever travels on the wire.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.notification.platform.common.event.NotificationRequested
spring.kafka.consumer.properties.spring.json.trusted.packages=com.notification.platform.common.event
notification.consumer.attempts=3

# --- Database (this module owns the schema) ----------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/notifications
spring.datasource.username=notification
spring.datasource.password=notification
# Flyway owns the DDL; Hibernate only checks the mapping matches it. Never let ddl-auto
# write to a Flyway-managed schema -- validate is the setting that keeps the two honest.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Auth --------------------------------------------------------------------
# Must match the api's secret: symmetric signing means the verifier holds the signing key.
notification.jwt.secret=dev-only-secret-please-override-me-0123456789

management.endpoints.web.exposure.include=health,info
