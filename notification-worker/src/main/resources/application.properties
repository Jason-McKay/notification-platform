spring.application.name=notification-worker
server.port=8081

spring.profiles.default=dev

# --- Kafka -------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-worker
# Read from the beginning the first time this group appears, so a worker started after the
# api has already published still delivers those notifications.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the real one. Without it a record that cannot be
# deserialized fails before the listener is ever called, so no retry or DLT machinery can
# see it and the container re-reads the same poison record for ever, stalling the partition.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
# JacksonJsonDeserializer is the Jackson 3 implementation; JsonDeserializer is the Jackson 2
# one and Boot 4 does not ship Jackson 2.
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# The consumer decides what type it is reading, not the producer. Paired with the producer's
# add.type.headers=false, so no class name ever travels on the wire.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.notification.platform.common.event.NotificationRequested
spring.kafka.consumer.properties.spring.json.trusted.packages=com.notification.platform.common.event
notification.consumer.attempts=3

# --- Database (this module owns the schema) ----------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/notifications
spring.datasource.username=notification
spring.datasource.password=notification
# Flyway owns the DDL; Hibernate only checks the mapping matches it. Never let ddl-auto
# write to a Flyway-managed schema -- validate is the setting that keeps the two honest.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Templates ---------------------------------------------------------------
# Placeholders are {{name}}, not ${name}: Spring resolves ${...} itself while binding, so a
# template variable spelled that way fails startup as an unresolvable placeholder. A key with
# no entry here is a failed delivery rather than a default -- see TemplateRenderer.
notification.templates.order-shipped.subject=Your order {{orderId}} has shipped
notification.templates.order-shipped.body=\
  Order {{orderId}} is on its way. We will let you know when it arrives.
notification.templates.order-delivered.subject=Your order {{orderId}} was delivered
notification.templates.order-delivered.body=\
  Order {{orderId}} has been delivered. Thanks for shopping with us.

# --- Auth --------------------------------------------------------------------
# Must match the api's secret: symmetric signing means the verifier holds the signing key.
notification.jwt.secret=dev-only-secret-please-override-me-0123456789

management.endpoints.web.exposure.include=health,info
